  <style>:root{color-scheme:light;--ink:#34504d;--muted:#68817a;--pink:#b34e73}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{background:#deede5;overflow:hidden}button,input,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #9a4771;outline-offset:5px}
#garden{position:fixed;inset:0;touch-action:none;cursor:grab}#garden:active{cursor:grabbing}#garden canvas{display:block;width:100%;height:100%}.atmosphere{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,#edf6ec55 0%,transparent 55%);}
header{position:fixed;inset:0 0 auto;z-index:3;padding:23px 30px;display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:25px;align-items:center}nav a{font-size:13px;color:var(--ink);text-decoration:none;text-shadow:0 1px 5px #fff8}nav a:hover{text-decoration:underline}button{color:inherit}.icon-button,.avatar{width:35px;height:35px;display:grid;place-items:center;border:0;background:#ffffff65;border-radius:50%;backdrop-filter:blur(8px)}.icon-button svg{width:17px;height:17px}.avatar{background:#fbecf0c9;border:1px solid #fff9;color:#b86581;font-size:27px}
main{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:90px 20px 110px}.search-content{position:relative;width:min(596px,100%);text-align:center;pointer-events:auto;transform:translateY(-13px)}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:2.4px;font-size:9px;font-weight:600;color:#5a7f75;margin-bottom:23px;text-shadow:0 1px 8px #fff}.eyebrow span{width:5px;height:5px;border-radius:50%;background:#c47d96}
h1{margin:0 0 29px;line-height:1}.google-logo{width:255px;height:auto;display:inline-block;filter:drop-shadow(0 3px 8px #f4fbef99)}form{margin:0}.search-box{display:flex;align-items:center;gap:15px;height:58px;background:#ffffffb5;box-shadow:0 8px 30px #4c706911,inset 0 1px 0 #fff;border:1px solid #ffffffdd;border-radius:32px;padding:0 10px 0 21px;backdrop-filter:blur(20px);transition:box-shadow .3s,background .3s}.search-box:focus-within{background:#fffffff2;box-shadow:0 5px 35px #41726322}.search-icon{width:20px;flex-shrink:0;color:#6b877e}input{width:100%;min-width:0;font:14px Arial,sans-serif;color:#314f49;background:none;border:0;outline:none!important;height:100%}input::placeholder{color:#7a9188;font-size:13px}.flower-button{font-size:25px;color:#c47c98;background:transparent;border:0;flex-shrink:0;padding:1px 2px;transition:transform .6s}.flower-button:hover{transform:rotate(100deg)}.search-submit{display:grid;place-items:center;border:0;background:#d7e8df91;border-radius:50%;width:35px;height:35px;flex-shrink:0}.search-submit svg{width:17px;height:17px}
.search-actions{display:flex;justify-content:center;gap:12px;margin-top:22px}.search-actions button{background:#ffffff6b;border:1px solid #ffffff6b;border-radius:6px;padding:10px 17px;font-size:12px;backdrop-filter:blur(15px);transition:background .2s,transform .2s}.search-actions button:hover{background:#fff;transform:translateY(-1px)}
.bloom-button{margin-top:33px;padding:8px 14px;display:inline-flex;align-items:center;gap:9px;border-radius:24px;border:1px solid #fff9;background:#fff2f5b5;box-shadow:0 2px 9px #b3698d08;backdrop-filter:blur(10px);color:#9e506d;font-size:11px;transition:transform .25s,background .25s}.bloom-button:hover{background:#fff5f9;transform:translateY(-2px)}.bloom-button>span{font-size:19px;line-height:1}.bloom-button svg{width:13px;height:13px;margin-left:6px}.status{font-size:10px;letter-spacing:.1px;color:#6d8b7f;margin-top:13px;min-height:15px;text-shadow:0 1px 4px #fff9}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:25px 31px;gap:12px;z-index:3;pointer-events:none}footer>*{pointer-events:auto}.study{display:flex;align-items:center;gap:11px;font-size:8px;letter-spacing:1.6px;color:#52756b}.study .flower-mark{font-size:29px;color:#b98a99;line-height:1}.study div{font-weight:600}.study div span{display:block;margin-top:6px;font-size:8px;letter-spacing:.25px;font-weight:400}.hint{display:flex;align-items:center;gap:9px;font-size:10px;color:#5e7f75;background:#f9fff440;padding:9px 13px;border-radius:20px;backdrop-filter:blur(10px)}.hint span{font-size:17px;line-height:1}.hint i{width:2px;height:2px;border-radius:50%;background:#68897e}.sound-button{display:flex;align-items:center;gap:9px;background:#fff9;border:1px solid #fffc;border-radius:22px;padding:10px 14px;font-size:10px;backdrop-filter:blur(15px)}.sound-button svg{width:15px;height:15px}.sound-button[aria-pressed=true]{background:#fae3edcc;color:#a55375}
#fallback{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);font-size:12px;pointer-events:none}body.loaded .search-content{animation:appear 1.2s ease both}@keyframes appear{from{opacity:0;transform:translateY(0)}to{opacity:1;transform:translateY(-13px)}}
.build-tools{display:flex;align-items:center;gap:8px}#undo-block{font-size:10px;border:1px solid #fff9;border-radius:20px;background:#fff9;color:#985f78;padding:9px 12px;backdrop-filter:blur(8px)}#undo-block[hidden]{display:none}
@media(max-width:700px){header{padding:18px 20px}nav{gap:17px}.eyebrow{font-size:8px;letter-spacing:1.5px}.google-logo{width:225px}.search-box{height:55px;gap:10px;padding-left:17px}.search-content{width:min(500px,100%)}footer{padding:20px}.hint{display:none}.study{font-size:7px;letter-spacing:1px}.study div span{font-size:7px;max-width:145px;line-height:1.4}.sound-button{padding:10px}.sound-button span{display:none}.search-actions button{font-size:11px}.status{font-size:10px}.bloom-button{margin-top:28px}input::placeholder{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
